[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifcred"
version = "0.1.0"
description = "IF-CRED: graded evidence for local individual-fairness audits"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "optuna>=4.0,<5",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "ucimlrepo>=0.0.7",
]

[project.scripts]
ifcred = "ifcred.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ifcred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
